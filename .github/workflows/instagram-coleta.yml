name: Instagram Virais — Coleta de perfis (3x/dia)

# Coleta os Reels recentes dos perfis monitorados (instagram_perfis ativos),
# poucos perfis por rodada com espaçamento — a conta descartável é o braço
# coletor, o banco é a fonte da verdade (se a conta cair, o acervo continua
# sendo exibido normalmente).

on:
  schedule:
    - cron: '41 */8 * * *'
  workflow_dispatch: {}

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Dispara coleta de perfis
        run: |
          echo "Iniciando às $(date -u +'%Y-%m-%d %H:%M:%S') UTC"
          HTTP_CODE=$(curl -sS --max-time 300 \
            -w "%{http_code}" \
            -o /tmp/resp.json \
            "https://bluetube-ten.vercel.app/api/instagram-virais?action=coletar-perfis&admin_secret=${{ secrets.ADMIN_SECRET }}")
          echo "HTTP: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Coleta falhou com HTTP $HTTP_CODE"
            cat /tmp/resp.json | head -c 500
            exit 1
          fi
          node -e "const d=JSON.parse(require('fs').readFileSync('/tmp/resp.json','utf8'));console.log('✓ perfis:',d.perfis,'| Reels inseridos:',d.inseridos,'| falhas:',(d.falhas||[]).length,'| motivo:',d.motivo||'-')"
