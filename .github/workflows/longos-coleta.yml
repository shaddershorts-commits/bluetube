name: Longos — coleta

# De 3 em 3 horas. Cada rodada gasta 8 buscas do YouTube (o item caro da API,
# ~100 chamadas/dia por chave), então 8 rodadas dão 64/dia — cabe numa chave só,
# sem encostar na cota que a Virais de Shorts já usa.
# Minuto 23 de propósito: cron do GitHub em minuto redondo disputa fila com o
# mundo inteiro e atrasa.
on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
    inputs:
      termos:
        description: 'Termos separados por vírgula (vazio = a fatia rotativa do horário)'
        required: false

jobs:
  coleta:
    runs-on: ubuntu-latest
    steps:
      - name: Coletar longos
        id: coleta
        run: |
          echo "Iniciando às $(date -u +'%Y-%m-%d %H:%M:%S') UTC"
          URL="https://bluetube-ten.vercel.app/api/longos?action=coletar&admin_secret=${{ secrets.ADMIN_SECRET }}"
          if [ -n "${{ github.event.inputs.termos }}" ]; then
            URL="$URL&termos=$(printf '%s' '${{ github.event.inputs.termos }}' | sed 's/ /%20/g')"
          fi
          HTTP_CODE=$(curl -sS --max-time 240 -w "%{http_code}" -o /tmp/resp.json "$URL")
          echo "HTTP: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Coleta falhou com HTTP $HTTP_CODE"
            cat /tmp/resp.json | head -c 700
            exit 1
          fi
          GRAVADOS=$(node -e "try{const d=JSON.parse(require('fs').readFileSync('/tmp/resp.json','utf8'));console.log(d.gravados||0)}catch(e){console.log('?')}")
          BUSCAS=$(node -e "try{const d=JSON.parse(require('fs').readFileSync('/tmp/resp.json','utf8'));console.log(d.buscas||0)}catch(e){console.log('?')}")
          # ⚠️ CINTO E SUSPENSÓRIO. O endpoint já responde 503 quando não grava
          # nada, e o teste acima pegaria. Esta segunda guarda existe porque foi
          # exatamente aqui que a coleta do TikTok morreu por 7 dias com ~40
          # rodadas VERDES: só o status HTTP era checado.
          if [ "$GRAVADOS" = "0" ] || [ "$GRAVADOS" = "?" ]; then
            echo "::error::HTTP 200 mas gravou $GRAVADOS vídeos — isto é falha, não silêncio."
            cat /tmp/resp.json | head -c 900
            exit 1
          fi
          echo "✓ Coleta OK | gravados: $GRAVADOS | buscas gastas: $BUSCAS"
          echo "gravados=$GRAVADOS" >> $GITHUB_OUTPUT
          echo "buscas=$BUSCAS" >> $GITHUB_OUTPUT

      - name: Resumo
        if: always()
        run: |
          echo "## Longos — coleta $(date -u +'%H:%M') UTC" >> $GITHUB_STEP_SUMMARY
          echo "Vídeos gravados: ${{ steps.coleta.outputs.gravados }}" >> $GITHUB_STEP_SUMMARY
          echo "Buscas gastas (cota YouTube): ${{ steps.coleta.outputs.buscas }}" >> $GITHUB_STEP_SUMMARY
