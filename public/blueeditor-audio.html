<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>BlueEditor · Biblioteca de Áudio</title>
<style>
  :root { --bg:#020817; --card:#0b1526; --border:#1e3a5f; --neon:#00aaff; --text:#dfe9ff; --sec:#7f9cc0; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:system-ui,Segoe UI,sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width: 820px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--sec); font-size: 13px; margin-bottom: 20px; }
  .card { background: var(--card); border:1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  label { display:block; font-size: 12px; color: var(--sec); margin: 8px 0 4px; }
  input, select { width:100%; padding: 9px 10px; border-radius:8px; border:1px solid var(--border); background:#04101f; color:var(--text); font-size:14px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  .row > div { flex:1; min-width: 140px; }
  button { background: linear-gradient(135deg,#1a6bff,var(--neon)); color:#fff; border:none; border-radius:8px; padding:10px 16px; font-weight:700; cursor:pointer; font-size:14px; }
  button.ghost { background:#04101f; border:1px solid var(--border); color:var(--sec); font-weight:500; padding:5px 10px; }
  .item { display:flex; align-items:center; gap:10px; padding:8px 6px; border-bottom:1px solid rgba(255,255,255,.06); font-size:13px; }
  .item .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tag { font-size:11px; color:var(--sec); }
  .grp-title { font-size:12px; font-weight:700; color:var(--neon); text-transform:uppercase; letter-spacing:.06em; margin:14px 0 6px; }
  .msg { font-size:13px; color:var(--sec); padding:8px 0; }
  .err { color:#ff6b6b; }
  a { color: var(--neon); }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎵 Biblioteca de Áudio — BlueEditor</h1>
  <div class="sub">Adicione músicas e efeitos sonoros por categoria. Eles aparecem na aba <b>Áudio</b> do editor pros usuários usarem.</div>

  <div class="card" id="authCard">
    <label>Senha de admin (ADMIN_SECRET)</label>
    <div class="row">
      <div><input id="secret" type="password" placeholder="cole a senha…"/></div>
      <div style="flex:0 0 auto"><button id="enter">Entrar</button></div>
    </div>
    <div id="authMsg" class="msg"></div>
  </div>

  <div id="app" style="display:none">
    <div class="card">
      <div class="grp-title" style="margin-top:0">Adicionar áudio</div>
      <div class="row">
        <div>
          <label>Tipo</label>
          <select id="fKind"><option value="music">Música</option><option value="sfx">Efeito sonoro</option></select>
        </div>
        <div>
          <label>Categoria</label>
          <input id="fCat" placeholder="ex: Lo-fi, Épica, Whoosh, Pop"/>
        </div>
      </div>
      <label>Nome</label>
      <input id="fName" placeholder="ex: Chill beat 1"/>
      <label>Arquivo de áudio (do seu PC — MP3, WAV, M4A)</label>
      <input id="fFile" type="file" accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg"/>
      <div style="margin-top:12px"><button id="addBtn">⬆ Enviar e adicionar</button> <span id="addMsg" class="msg"></span></div>
    </div>

    <div class="card">
      <div class="grp-title" style="margin-top:0">Na biblioteca</div>
      <div id="list"><div class="msg">Carregando…</div></div>
    </div>
  </div>
</div>

<script>
const API = '/api/blue-editor';
let secret = localStorage.getItem('be_audio_admin') || '';
const $ = (id) => document.getElementById(id);

async function call(action, body) {
  const r = await fetch(API, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action, admin_secret: secret, ...body }) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
  return d;
}

async function tryAuth() {
  try { await call('audio-lib-list', {}); $('authCard').style.display='none'; $('app').style.display='block'; loadList(); }
  catch (e) { $('authMsg').innerHTML = '<span class="err">'+e.message+'</span>'; }
}

$('enter').onclick = () => { secret = $('secret').value.trim(); localStorage.setItem('be_audio_admin', secret); tryAuth(); };

$('addBtn').onclick = async () => {
  const name = $('fName').value.trim();
  const file = $('fFile').files[0];
  if (!name || !file) { $('addMsg').innerHTML = '<span class="err">Nome e arquivo são obrigatórios</span>'; return; }
  const btn = $('addBtn'); btn.disabled = true;
  try {
    $('addMsg').textContent = 'Enviando arquivo…';
    const ext = (file.name.split('.').pop() || 'mp3').toLowerCase();
    const { upload_url, public_url } = await call('audio-lib-sign', { ext });
    const put = await fetch(upload_url, { method:'PUT', headers:{ 'Content-Type': file.type || 'audio/mpeg' }, body: file });
    if (!put.ok) throw new Error('Upload falhou (HTTP ' + put.status + ')');
    $('addMsg').textContent = 'Salvando na biblioteca…';
    const duration = await probeDur(file);
    await call('audio-lib-add', { kind:$('fKind').value, category:$('fCat').value.trim()||'Geral', name, url: public_url, duration });
    $('addMsg').textContent = 'Adicionado ✓';
    $('fName').value=''; $('fFile').value='';
    loadList();
  } catch (e) { $('addMsg').innerHTML = '<span class="err">'+e.message+'</span>'; }
  finally { btn.disabled = false; }
};

function probeDur(file) {
  return new Promise((res) => {
    const a = new Audio(); const u = URL.createObjectURL(file);
    a.onloadedmetadata = () => { URL.revokeObjectURL(u); res(isFinite(a.duration) ? a.duration : null); };
    a.onerror = () => { URL.revokeObjectURL(u); res(null); };
    a.src = u; setTimeout(() => res(null), 8000);
  });
}

async function loadList() {
  const box = $('list'); box.innerHTML = '<div class="msg">Carregando…</div>';
  try {
    const { items } = await call('audio-lib-list', {});
    if (!items.length) { box.innerHTML = '<div class="msg">Nada ainda. Adicione acima.</div>'; return; }
    box.innerHTML = '';
    const groups = {};
    for (const it of items) { const k = (it.kind==='sfx'?'Efeitos':'Músicas')+' · '+it.category; (groups[k]=groups[k]||[]).push(it); }
    for (const [g, arr] of Object.entries(groups)) {
      const t = document.createElement('div'); t.className='grp-title'; t.textContent = g; box.appendChild(t);
      for (const it of arr) {
        const row = document.createElement('div'); row.className='item';
        row.innerHTML = `<button class="ghost" data-play="${it.url}">▶</button><span class="nm">${it.name}</span><span class="tag">${it.duration?Math.round(it.duration)+'s':''}</span>`;
        const del = document.createElement('button'); del.className='ghost'; del.textContent='🗑';
        del.onclick = async () => { if (!confirm('Excluir "'+it.name+'"?')) return; await call('audio-lib-delete',{id:it.id}); loadList(); };
        row.appendChild(del); box.appendChild(row);
      }
    }
    box.querySelectorAll('[data-play]').forEach(b => { let a=null; b.onclick=()=>{ if(a&&!a.paused){a.pause();return;} a=new Audio(b.dataset.play); a.play().catch(()=>{}); }; });
  } catch (e) { box.innerHTML = '<div class="msg err">'+e.message+'</div>'; }
}

if (secret) tryAuth();
</script>
</body>
</html>
