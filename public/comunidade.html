<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Comunidade BlueTube — o espaço dos criadores</title>
<meta name="description" content="Feed exclusivo dos assinantes BlueTube: dicas, tutoriais, resultados e networking com criadores dark que fazem milhões de views.">
<meta property="og:title" content="Comunidade BlueTube">
<meta property="og:description" content="O espaço exclusivo dos criadores BlueTube — dicas, posts e networking.">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{--font-display:'Syne',sans-serif;--font-mono:'DM Mono',monospace;--neon:#00aaff;--blue-950:#020817;--text-primary:#e8f0fb;--text-secondary:#8aa0bd;--text-dim:#5f7590;--blue-500:#0077ff}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--blue-950);color:var(--text-primary);font-family:var(--font-display);min-height:100vh;overflow-x:hidden}
.pg-top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(2,8,23,.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(0,170,255,.12)}
.pg-back{display:flex;align-items:center;gap:8px;color:var(--text-secondary);text-decoration:none;font-family:var(--font-mono);font-size:12px;padding:7px 12px;border:1px solid rgba(0,170,255,.18);border-radius:9px;transition:all .2s}
.pg-back:hover{color:#fff;border-color:rgba(0,170,255,.45)}
.pg-logo{margin-left:auto;font-weight:800;font-size:15px;letter-spacing:-.4px;color:#fff;text-decoration:none}
.pg-logo span{color:var(--neon)}
</style>
</head>
<body>
<header class="pg-top">
  <a class="pg-back" href="/">← Voltar ao site</a>
  <a class="pg-logo" href="/">Blue<span>Tube</span></a>
</header>
<main id="pgMain"></main>
<script src="/comunidade.js?v=2"></script>
<script>
  // Modo página: painel renderiza inline dentro de #pgMain (sem overlay/popup)
  ComunidadeBT.open({ page: true, profile: location.hash === '#perfil' });
</script>
</body>
</html>
