<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Comunidade BlueTube — o espaço dos criadores</title>
<meta name="description" content="Feed exclusivo dos assinantes BlueTube: dicas, tutoriais, resultados e networking com criadores dark que fazem milhões de views.">
<meta property="og:title" content="Comunidade BlueTube">
<meta property="og:description" content="O espaço exclusivo dos criadores BlueTube — dicas, posts e networking.">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{--font-display:'Syne',sans-serif;--font-mono:'DM Mono',monospace;--font-sans:'Inter',system-ui,sans-serif;--neon:#00aaff;--blue-950:#020817;--text-primary:#e8f0fb;--text-secondary:#8aa0bd;--text-dim:#5f7590;--blue-500:#0077ff}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#020817;color:var(--text-primary);font-family:var(--font-display);min-height:100vh;overflow-x:hidden}
/* fundo com profundidade: orbs liquid glass fixos (mesma linguagem da home) */
.pg-orbs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.pg-orb{position:absolute;border-radius:50%;filter:blur(110px)}
.pg-orb-1{width:760px;height:760px;top:-260px;left:50%;transform:translateX(-62%);background:radial-gradient(circle,rgba(0,110,255,.16) 0%,transparent 65%);animation:pgPulse 9s ease-in-out infinite alternate}
.pg-orb-2{width:560px;height:560px;bottom:-180px;right:-140px;background:radial-gradient(circle,rgba(0,170,255,.1) 0%,transparent 65%);animation:pgPulse 13s ease-in-out infinite alternate-reverse}
.pg-orb-3{width:460px;height:460px;top:36%;left:-160px;background:radial-gradient(circle,rgba(251,191,36,.06) 0%,transparent 68%);animation:pgPulse 11s ease-in-out infinite alternate}
@keyframes pgPulse{from{opacity:.65;transform:scale(1) translateX(var(--tx,0))}to{opacity:1;transform:scale(1.12) translateX(var(--tx,0))}}
.pg-orb-1{--tx:-62%}
@media(prefers-reduced-motion:reduce){.pg-orb{animation:none}}
.pg-top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:12px 20px;background:rgba(2,8,23,.6);backdrop-filter:blur(24px) saturate(140%);-webkit-backdrop-filter:blur(24px) saturate(140%);border-bottom:1px solid rgba(0,170,255,.09)}
.pg-back{display:flex;align-items:center;gap:8px;color:var(--text-secondary);text-decoration:none;font-family:var(--font-mono);font-size:12px;padding:8px 14px;background:rgba(10,22,40,.5);border:1px solid rgba(0,170,255,.16);border-radius:100px;transition:all .2s;backdrop-filter:blur(12px)}
.pg-back:hover{color:#fff;border-color:rgba(0,170,255,.45);box-shadow:0 0 18px rgba(0,170,255,.15)}
.pg-logo{margin-left:auto;font-weight:800;font-size:15px;letter-spacing:-.4px;color:#fff;text-decoration:none}
.pg-logo span{color:var(--neon)}
main{position:relative;z-index:1}
</style>
</head>
<body>
<div class="pg-orbs"><div class="pg-orb pg-orb-1"></div><div class="pg-orb pg-orb-2"></div><div class="pg-orb pg-orb-3"></div></div>
<header class="pg-top">
  <a class="pg-back" href="/">← Voltar ao site</a>
  <a class="pg-logo" href="/">Blue<span>Tube</span></a>
</header>
<main id="pgMain"></main>
<script src="/comunidade.js?v=5"></script>
<script>
  // Modo página: painel renderiza inline dentro de #pgMain (sem overlay/popup)
  ComunidadeBT.open({ page: true, profile: location.hash === '#perfil' });
</script>
</body>
</html>
